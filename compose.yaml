---
# Pins the container and network names, so they don't follow the directory this was cloned into.
name: house-finder

services:
  house-finder:
    build:
      context: .
      dockerfile: devops/Dockerfile
    command: watch
    # Starts again with the Docker daemon, so it survives laptop reboots.
    restart: unless-stopped
    env_file: .env
    environment:
      HOUSE_FINDER_DB__PATH: /data/house_finder.sqlite
      # Idealista reads its anti-bot cookie from this Firefox profile (path from about:profiles), mounted read-only.
      HOUSE_FINDER_IDEALISTA__FIREFOX_PROFILE: /firefox
    volumes:
      - ./data:/data
      # Idealista's anti-bot cookie. FIREFOX_PROFILE is the "Root Directory" of the profile in Firefox's
      # about:profiles, which visits idealista.com now and then. Unset, the mount is empty and only the Idealista
      # API and the alert emails work.
      - ${FIREFOX_PROFILE:-/firefox}:/firefox:ro
