---
extends: default

rules:
  line-length:
    max: 120
    level: warning
  indentation:
    spaces: 2
    indent-sequences: true
  truthy:
    allowed-values: ["true", "false", "yes", "no"]
    check-keys: false
  braces:
    min-spaces-inside: 1
    max-spaces-inside: 1
  comments:
    level: warning
  anchors:
    level: warning
